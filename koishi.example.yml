# 本插件在 koishi.yml 中的配置示例。
# 可直接把下面 plugins 段合并进 Koishi 实例的 koishi.yml，
# 键名也可写成带实例后缀的形式，例如 chatgpt-bridge:xw6vpk。
#
# 完整配置与迁移步骤见 docs/installation.md。

plugins:
  chatgpt-bridge:
    # 必需。允许在【私聊】调用本插件的 QQ openid 列表。
    # ["*"] 表示允许所有 QQ 私聊用户。群聊是否可用由下面的 groupChat 单独控制，
    # 本列表不参与群聊判定。
    allowedUsers:
      - '替换为你的 QQ openid'

    # 以下均为可选，不写即使用默认值。

    # 新安装默认 <实例>/data/codex-image-local；相对路径从 koishi.yml 所在目录解析。
    # 旧版源码部署切换 npm 安装前，先显式填入原数据目录绝对路径，避免另建空会话库。
    # dataDir: /绝对路径/原项目/data

    # 群聊支持。默认 false，即群聊完全不响应（保持历史行为）。
    # 设为 true 后，群里任何成员 @ 机器人即可使用，回复直接发到群里，群成员均可见。
    # 群里的 @ 是硬性前提：Koishi 不会把未被 @ 的群消息交给本插件。
    # 注意：一旦开启，群里任何人都能消耗你账号的 ChatGPT 网页额度。
    # groupChat: true

    # 是否默认发送接收确认和进度提醒。默认 true；false 表示只发最终回复或失败原因。
    # 用户可用 /logs on|off 覆盖，按用户和聊天位置保存。
    # notifyProgress: false

    # 技能库。默认 dataDir/skills；首次创建默认目录时安装文本整理与人像技能示例。
    # QQ 用 /skill 选择，聊天中选择会进入工作模式；本地技能选择独立保存。
    # 自定义目录必须已存在且为普通目录；只读，不安装示例。不读取符号链接。
    # 目录结构：技能库/skill-name/SKILL.md，name 与目录名一致。
    # 仅加载技能文本，不执行附带脚本、CLI 或 MCP 工具。
    # skillsDir: /绝对路径/skills

    # 本机 LM Studio。在 QQ 发 /mode 本地 启用，/mode 聊天 或 /mode 工作 切回。
    # /model 查看可用模型，/model 编号 选择。
    # 默认地址如下，仅接受本机回环地址。一个聊天模型时可不指定模型编号。
    # lmStudioBaseUrl: http://127.0.0.1:1234/v1
    # lmStudioModel: google/gemma-4-31b
    # 服务启用认证时配置；建议通过 Koishi 的环境变量引用提供令牌。
    # lmStudioApiKey: ${{ env.LM_STUDIO_API_KEY }}
    # 每次最大生成 token 数；与模型自身上下文窗口共同约束请求。
    # lmStudioMaxTokens: 2048
    # 保存最近多少轮和总字符数，超出时按完整问答对移除最早历史。
    # lmStudioHistoryTurns: 20
    # lmStudioHistoryChars: 12000
    # 视觉模型的会话图片上限；超限时移除最早完整问答和不再引用的原图。
    # 原图随会话独立保存，清理任务后仍可续聊。上限须容纳一次允许的最大输入。
    # lmStudioHistoryImages: 4
    # lmStudioHistoryImageBytes: 20971520

    # 本机桥接端口，需与 browser-extension/config.js 中的地址保持一致。
    # 默认 5141。改动后在实例目录重跑：npx --no-install koishi-gpt-bridge-setup --port <端口>
    # webBridgePort: 5141

    # 单条消息的文字上限，同时也是单条回复的拆分长度。默认 1500 字。
    # maxTextChars: 1500

    # 一条回复回传到 QQ 的总文字上限。默认 6000 字，超出会截断并提示，
    # 完整内容仍保留在本机 reply.md；重发同样受长度限制。
    # maxReplyChars: 6000

    # 单条消息可携带的参考图数量。默认 2 张。
    # maxInputImages: 2

    # 单张参考图体积上限（字节）。默认 10 MB。
    # maxInputBytes: 10485760

    # 等待网页回复的超时上限（毫秒）。默认 5 分钟。
    # 实际还受 QQ 回复窗口约束：收消息后约 270 秒进入停止流程，预留反馈时间。
    # replyTimeoutMs: 300000

    # 每次 QQ 发送的确认超时（毫秒），默认 20 秒。超时不自动重复发送。
    # sendTimeoutMs: 20000
    # mediaSendTimeoutMs: 60000

    # 任务保留天数。不写＝永久保留。
    # 设为大于 0 时，已结束（完成/失败/取消/中断）的任务超过该天数会在启动时
    # 及之后每 6 小时整体删除，回收参考图与结果图占用；排队中和运行中的永不删除。
    # retentionDays: 30
